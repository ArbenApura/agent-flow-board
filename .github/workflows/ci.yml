name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn
      - run: yarn install --immutable
      - run: yarn check
      - run: yarn check:packages
      - run: yarn lint
      - run: yarn format:check
      - run: yarn test
      # The build checks the environment, so it gets placeholders that exist only in this job
      - run: yarn build
        env:
          AFB_BASE_URL: https://build.invalid
          BETTER_AUTH_SECRET: build-time-placeholder-0123456789abcdef

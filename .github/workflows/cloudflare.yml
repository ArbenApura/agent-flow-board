name: cloudflare
on:
  pull_request:
    paths:
      - 'cloudflare/**'
      - 'package.json'
      - 'yarn.lock'
      - '.yarnrc.yml'
      - 'wrangler*.jsonc'
      - 'tests/cloudflare/**'
      - 'src/lib/server/**'
  push:
    branches: [main]

jobs:
  worker:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: pgpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGPASSWORD: pgpass
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn
      - run: yarn install --immutable
      - name: The same roles the self-hosting image makes
        run: |
          psql -h localhost -U postgres -c "CREATE ROLE afb_owner LOGIN CREATEROLE PASSWORD 'ownerpass1234'" -c "CREATE DATABASE afb OWNER afb_owner"
          psql -h localhost -U postgres -d afb -c "ALTER SCHEMA public OWNER TO afb_owner"
      - name: Row isolation on a real PostgreSQL (the driver the Worker uses)
        run: yarn vitest run tests/db/isolation.test.ts tests/auth/orgs.test.ts
      - name: Migrate as the owner, which is not a superuser
        run: yarn db migrate
        env:
          DATABASE_URL: postgres://afb_owner:ownerpass1234@localhost:5432/afb
          AFB_RUNTIME_PASSWORD: runtime-test-pass-1234567890
      - name: Build the Worker
        run: yarn build:cloudflare
        env:
          AFB_BASE_URL: https://build.invalid
          BETTER_AUTH_SECRET: build-time-placeholder-0123456789abcdef
      - name: Check that the Worker bundles
        run: yarn wrangler deploy --dry-run --outdir .afb/worker-out
      - name: Start the Worker with Hyperdrive, R2, the queue and the hub object (local copies)
        run: |
          nohup yarn wrangler dev --port 8787 \
            --var AFB_BASE_URL:http://localhost:8787 \
            --var BETTER_AUTH_SECRET:trial-secret-0123456789abcdef0123456789 \
            --var AFB_MASTER_KEY:trial-master-key-0123456789abcdef012345 \
            --var EMAIL_PROVIDER:log --var AFB_RATE_LIMIT:off --var AFB_PWNED_CHECK:off > worker.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:8787/sign-in >/dev/null && exit 0; sleep 2; done
          cat worker.log
          exit 1
        env:
          CLOUDFLARE_HYPERDRIVE_LOCAL_CONNECTION_STRING_HYPERDRIVE: postgres://app_runtime:runtime-test-pass-1234567890@localhost:5432/afb
      - run: yarn playwright install --with-deps chromium
      - name: Two people through the Worker, M3 through Hyperdrive
        run: node tests/cloudflare/check.mjs
        env:
          WORKER_URL: http://localhost:8787
          ADMIN_DATABASE_URL: postgres://postgres:pgpass@localhost:5432/afb
      - if: failure()
        run: cat worker.log

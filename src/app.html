		<!-- THE BROWSER PAINTS ITS OWN CANVAS (WHITE UNLESS THE PAGE SAYS DARK) UNTIL THE STYLESHEET ARRIVES, SO THE MODE IS TOLD HERE, INLINE, BEFORE ANY FILE LOADS. NO COLOUR VALUE NEEDED, THE TOKENS TAKE OVER FROM THERE -->
		<style>
			html[data-mode='dark'] {
				color-scheme: dark;
			}
			html[data-mode='light'] {
				color-scheme: light;
			}
		</style>

			%afb.modescript%
		</script>
		<script src="%sveltekit.assets%/swr.js"></script>
		<script>
			// THE SHELL SHOWS ITS OWN SKELETON AND THE LAST PALETTE OF THIS ORGANISATION BEFORE THE APP MOUNTS (13.2). NOTHING HERE READS THE SERVER
			try {
				var seg = location.pathname.split('/')[1] || '';
				var auth = /^(sign-in|sign-up|verify|reset|invite|device|oauth)$/.test(seg);
				document.documentElement.setAttribute('data-boot', auth ? 'auth' : 'app');
				// THE SIDEBAR OF AN ORGANISATION IS A SLIM RAIL UNTIL THE POINTER IS ON IT
				document.documentElement.setAttribute('data-side', 'collapsed');
				// AN ORGANISATION'S OWN PAGE (ONE SEGMENT) DRAWS THE SHAPE IT HAD LAST TIME, THE FIRST PROJECT PROMPT OR THE PROJECT CARDS
				if (seg === 'connect' || seg === 'settings')
					document.documentElement.setAttribute('data-org', 'account');
				else if (
					seg !== '' &&
					!auth &&
					location.pathname.replace(/\/+$/, '').split('/').length === 2
				)
					document.documentElement.setAttribute(
						'data-org',
						localStorage.getItem('afb-org:' + seg) || 'cards'
					);
				// THE HOME PAGE DRAWS THE SHAPE IT HAD LAST TIME, A ROW OF ORGANISATIONS OR THE FIRST ORGANISATION FORM
				if (seg === '')
					document.documentElement.setAttribute(
						'data-org',
						localStorage.getItem('afb-home') === 'empty' ? 'welcome' : 'orgs'
					);
				var css = localStorage.getItem('afb-palette:' + seg);
				if (css) {
					var st = document.createElement('style');
					st.id = 'afb-palette-boot';
					st.textContent = css;
					document.head.appendChild(st);
				}
			} catch (e) {
				/* Storage can be blocked, the skeleton still shows */
			}
		</script>
		%sveltekit.head%
	</head>

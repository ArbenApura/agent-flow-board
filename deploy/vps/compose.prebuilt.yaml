# FOR A SMALL SERVER: BUILD THE IMAGE FROM A BUILD MADE ELSEWHERE, SO THE SERVER NEVER RUNS VITE (A BUILD THERE RAN A 3.7 GB SERVER OUT OF MEMORY)
# Added on top of compose.yaml:   docker compose -f compose.yaml -f compose.prebuilt.yaml up -d --build
# or once for the shell:          export COMPOSE_FILE=compose.yaml:compose.prebuilt.yaml
# It needs build/ and cli/ next to Dockerfile.prebuilt. deploy/vps/deploy.ps1 builds them on the developer's PC and sends them.

services:
  app:
    build:
      context: ../..
      dockerfile: Dockerfile.prebuilt
